<title>Justin’s Sheet</title>
<style>
:root{--bg:#f7f4f8;--card:#fff;--ink:#2a2030;--mute:#7a6f82;--line:#e4dce8;--accent:#7b4a8a;--accent-ink:#fff;--prio:#d393a1;--fut:#c09fc2;--done:#8aa68f;--danger:#b4474f}
@media(prefers-color-scheme:dark){:root{--bg:#1a141d;--card:#251d29;--ink:#efe8f2;--mute:#a597ad;--line:#3a2f40;--accent:#c09fc2;--accent-ink:#1a141d;--prio:#d393a1;--fut:#8e6f93;--done:#7b9a82;--danger:#e0707a}}
*{box-sizing:border-box}
.futlist{max-height:190px;overflow:auto;border:1px solid var(--line);border-radius:10px;margin-top:6px}
.futlist div{padding:7px 10px;cursor:pointer;border-bottom:1px solid var(--line);font-size:.92rem}
.futlist div:last-child{border-bottom:0}
.futlist div:hover{background:rgba(127,127,127,.12)}
.futlist div.on{background:var(--accent);color:var(--accent-ink);font-weight:600}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.45 ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",sans-serif;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
h1,h2,h3{margin:0;line-height:1.2}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:980px;margin:0 auto;padding:16px}
header{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;justify-content:space-between;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:8px 0;margin-bottom:6px}
header h1{font-size:1.3rem}
nav{display:flex;gap:6px}
nav button,.seg button{border:1px solid var(--line);background:var(--card);padding:7px 14px;border-radius:999px;cursor:pointer}
nav button.on,.seg button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.link{background:none;border:0;color:var(--mute);cursor:pointer;text-decoration:underline;padding:4px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px}
.card h2{font-size:1.05rem}
.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:8px}
.row{display:flex;gap:8px;align-items:center;padding:2px 6px;border-radius:4px;font-size:.8rem;line-height:1.3;cursor:pointer}
.row+.row{border-top:1px solid var(--line)}
.row.th{cursor:default;font-weight:600;color:var(--accent)}
.row.pr{background:color-mix(in srgb,var(--prio) 28%,transparent)}
.row .c0{flex:0 0 2.8em;text-align:right;color:var(--mute);font-variant-numeric:tabular-nums}
.row .c1{flex:0 0 30%;min-width:0;overflow-wrap:anywhere;border-left:3px solid var(--prio);padding-left:6px}
.c1.future{border-color:var(--fut)}.c1.done{border-color:var(--done)}.th .c1{border-color:transparent}
.row .c2{flex:1;min-width:0;overflow-wrap:anywhere}
.row .c3{flex:none;width:84px}
.empty-desc{color:var(--mute)}
.chk,.chk-sp{flex:none;width:20px;height:20px}
.chk{border-radius:50%;border:2px solid var(--line);background:none;cursor:pointer;color:var(--done);font-size:.65rem;padding:0;line-height:1}
.chk:hover{border-color:var(--done)}
.cat{font-size:.85rem;color:var(--mute)}
.side{display:flex;flex-direction:column;align-items:flex-end;line-height:1}
.gear{background:none;border:0;cursor:pointer;color:var(--mute);font-size:.95rem;padding:2px 4px}
.chkrow{display:flex;align-items:center;gap:10px;margin:0;padding:6px 0;color:var(--ink);font-size:.9rem;border-top:1px solid var(--line);cursor:pointer}
.chkrow input{width:auto}.chkrow span:nth-of-type(1){flex:1}
.row .t1{flex:1;min-width:0;overflow-wrap:anywhere}.row .t2,.row .t3{flex:0 0 5.2em}.row .t4{flex:0 0 3.6em;text-align:right}.row .t5{flex:0 0 9.5em;white-space:nowrap}
.paused{color:var(--danger)}.dropped{color:var(--mute);text-decoration:line-through}
.cols{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:12px;align-items:start}.cols .card,.ovg .card{margin:0}
.ovg{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:12px}
@media(max-width:720px){.cols{grid-template-columns:1fr}}
.seg.sm button{padding:3px 10px;font-size:.8rem}
.arrow{background:none;border:0;color:var(--mute);cursor:pointer;padding:0 2px;font-size:.7rem}
table.mx{border-collapse:collapse;font-size:.85rem;width:100%}table.mx td,table.mx th{padding:4px 8px;text-align:right;border-bottom:1px solid var(--line)}table.mx td:first-child,table.mx th:first-child{text-align:left}
.ds{display:none}
@media(max-width:600px){
.wrap{padding:10px}.card{padding:10px}

<body>
<div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const db = supabase.createClient(
  'https://vcoydiomjzkkukfqfywz.supabase.co',
  'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZjb3lkaW9tanpra3VrZnFmeXd6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM3NTYxMTEsImV4cCI6MjEwOTMzMjExMX0.8rSgG9hrmYON9ot0d37ytCIo_vkhhdwU_DePGOvxPSM'
);
let _mk = '';
function loadSet(n) { try { return new Set(JSON.parse(localStorage.getItem(n) || '[]')); } catch (e) { return new Set(); } }
function saveSets() { try { localStorage.setItem('bk_shut', JSON.stringify([...S.bshut])); localStorage.setItem('bk_open', JSON.stringify([...S.bopen])); localStorage.setItem('mg_shut', JSON.stringify([...S.mshut])); localStorage.setItem('mg_open', JSON.stringify([...S.mopen])); localStorage.setItem('mg_wrap', S.mwrap ? '1' : '0'); localStorage.setItem('ga_shut', JSON.stringify([...S.gshut])); localStorage.setItem('ga_open', JSON.stringify([...S.gopen])); localStorage.setItem('ga_wrap', S.gwrap ? '1' : '0'); localStorage.setItem('md_shut', JSON.stringify([...S.mdshut])); localStorage.setItem('md_open', JSON.stringify([...S.mdopen])); localStorage.setItem('md_wrap', S.mdwrap ? '1' : '0'); localStorage.setItem('mu_open', JSON.stringify([...S.muopen])); localStorage.setItem('mu_ashut', JSON.stringify([...S.muashut])); localStorage.setItem('bk_wrap', S.bwrap ? '1' : '0'); } catch (e) { /* storage unavailable */ } }
const S = { malb: [], msong: [], muErr: null, mum: null, muq: '', muopen: loadSet('mu_open'), muashut: loadSet('mu_ashut'), media: [], mdErr: null, mdm: null, mdq: '', mdst: null, mdrate: false, mdsub: 'shows', mdshut: loadSet('md_shut'), mdopen: loadSet('md_open'), mdwrap: (() => { try { return localStorage.getItem('md_wrap') !== '0'; } catch (e) { return true; } })(), games: [], gaErr: null, gm: null, gq: '', gst: null, gunsure: false, grate: false, gshut: loadSet('ga_shut'), gopen: loadSet('ga_open'), gwrap: (() => { try { return localStorage.getItem('ga_wrap') !== '0'; } catch (e) { return true; } })(), manga: [], mgErr: null, mm: null, mq: '', mst: null, munsure: false, mrate: false, mshut: loadSet('mg_shut'), mopen: loadSet('mg_open'), bwrap: (() => { try { return localStorage.getItem('bk_wrap') !== '0'; } catch (e) { return true; } })(), mwrap: (() => { try { return localStorage.getItem('mg_wrap') !== '0'; } catch (e) { return true; } })(), books: [], bkErr: null, bm: null, bren: null, bord: false, bkreset: false, bsub: 'books', bq: '', bst: null, bshut: loadSet('bk_shut'), bopen: loadSet('bk_open'), wcat: null, pcat: null, re: null, rogue: [], stab: 'cats', ce: null, user: null, entries: [], options: [], tab: 'home', wheel: null, current: [], curErr: null, cat: 'overview', flt: 'all', yr: null, cm: null, settings: false, sub: 'now', bulk: null, anchor: false, q: '', modal: null, loading: false };
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const today = () => { const d = new Date(); return new Date(d - d.getTimezoneOffset() * 6e4).toISOString().slice(0, 10); };
const fmtS = d => { if (!d) return ''; const [y, m, dd] = d.split('-'); return `${+m}/${+dd}/${y.slice(2)}`; };
const fmt = d => d ? new Date(d + 'T00:00').toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' }) : '';
const by = st => S.entries.filter(e => e.status === st);
const norm = s => (s || '').trim().toLowerCase();

function toast(msg) { const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.append(t); setTimeout(() => t.remove(), 2600); }

async function loadAll() {
  S.loading = true; render();
  let all = [];
  for (let from = 0; ; from += 1000) {
    const { data, error } = await db.from('log_entries').select('*').order('sort_order').range(from, from + 999);
    if (error) { toast('Could not load: ' + error.message); break; }
    all = all.concat(data);
    if (data.length < 1000) break;
  }
  S.entries = all;
  const o = await db.from('wheel_options').select('*').order('sort_order');
  S.options = o.data || [];
  const c = await db.from('current_items').select('*').order('sort_order');
  S.current = c.data || []; S.curErr = c.error ? c.error.message : null;
  const bk = await db.from('books').select('*').order('sort_order').range(0, 999); S.books = bk.data || []; S.bkErr = bk.error ? bk.error.message : null;
  await loadMusic();
  const md = await db.from('media').select('*').range(0, 999); S.media = md.data || []; S.mdErr = md.error ? md.error.message : null;
  const ga = await db.from('games').select('*').range(0, 999); S.games = ga.data || []; S.gaErr = ga.error ? ga.error.message : null;
  const mg = await db.from('manga').select('*').range(0, 999); S.manga = mg.data || []; S.mgErr = mg.error ? mg.error.message : null;
  const rg = await db.from('roguelikes').select('*').order('sort_order'); S.rogue = rg.data || [];
  S.loading = false; S.anchor = true; render();
}

function catCounts() { const c = {}; S.entries.forEach(e => { if (e.category) c[e.category] = (c[e.category] || 0) + 1; }); return c; }
const visible = n => { const o = S.options.find(x => x.name === n); return !o || o.show_in_menu !== false; };
function allCats() {
  const c = catCounts(), base = S.options.length ? S.options.map(o => o.name) : Object.keys(c);
  return [...new Set(base)].sort((a, b) => (c[b] || 0) - (c[a] || 0) || a.localeCompare(b));
}
function categories(extra) { const l = allCats().filter(n => visible(n) || n === extra); if (extra && !l.includes(extra)) l.push(extra); return l; }

/* ---------- views ---------- */
function rowHtml(e, n, cols = '', cls = '') {
  return `<div class="row ${cls}" data-edit="${e.id}"><div class="c0">${n}</div><div class="c1 ${e.status}"${cols.includes('f') && e.category ? ` data-catf="${esc(e.category)}" title="Show only this category"` : ''}>${esc(e.category) || '—'}</div>
    <div class="c2 ${e.description ? '' : 'empty-desc'}">${esc(e.description) || '—'}</div>
    ${cols.includes('d') ? `<div class="c3"><span class="dl">${fmt(e.done_on)}</span><span class="ds">${fmtS(e.done_on)}</span></div>` : ''}
    ${cols.includes('c') ? (e.status === 'priority' ? `<button class="chk" title="Mark done" data-finish="${e.id}">✓</button>` : '<span class="chk-sp"></span>') : ''}</div>`;
}
const thHtml = cols => `<div class="row th"><div class="c0">#</div><div class="c1">Wheel spin</div><div class="c2">What</div>${cols.includes('d') ? '<div class="c3">Date</div>' : ''}${cols.includes('c') ? '<span class="chk-sp"></span>' : ''}</div>`;

function priorityCard() {
  const fut = S.sub === 'future', st = fut ? 'future' : 'priority', cols = fut ? '' : 'cf';
  let list = by(st);
  const filt = !fut && S.pcat;
  if (fut) list.sort((a, b) => (a.category || '~').localeCompare(b.category || '~') || a.sort_order - b.sort_order);
  if (filt) list = list.filter(e => e.category === S.pcat);
  const t = (k, l, n) => `<button class="${S.sub === k ? 'on' : ''}" data-sub="${k}">${l} (${n})</button>`;
  return `<div class="card"><div class="head"><div class="seg" style="margin:0">${t('now', 'Priority', by('priority').length)}${t('future', 'Future', by('future').length)}</div>
    <div class="acts" style="margin:0"><button class="btn alt" data-roll>Roll</button><button class="btn alt" data-bulk="${st}">Bulk add</button><button class="btn" data-add="${st}">Add</button></div></div>
    ${filt ? `<div class="cat" style="margin-bottom:6px">Showing only <b>${esc(S.pcat)}</b> (${list.length})</div>` : ''}
    ${thHtml(cols)}${list.map((e, i) => rowHtml(e, i + 1, cols)).join('') || '<div class="cat">Nothing here yet.</div>'}
    ${filt ? '<div class="acts"><button class="btn alt" data-catback>← Back to all priority</button></div>' : ''}</div>`;
}

function home() { return priorityCard(); }

function wheel() {
  const w = S.wcat, keep = x => !w || x.category === w;
  const d = by('done').filter(keep).sort((a, b) => (a.done_on || '').localeCompare(b.done_on || '') || a.sort_order - b.sort_order);
  const p = by('priority').filter(keep), q = norm(S.q);
  let first = true;
  const rows = [...d, ...p].map((e, i) => [e, i + 1])
    .filter(([e]) => !q || norm(e.category).includes(q) || norm(e.description).includes(q))
    .map(([e, n]) => { const isP = e.status === 'priority'; const cls = isP ? 'pr' + (first ? ' first-p' : '') : ''; if (isP) first = false; return rowHtml(e, n, 'dcf', cls); }).join('');
  return `<div class="card"><div class="head"><h2>${w ? esc(w) : 'Wheel'}</h2><span class="cat">${d.length.toLocaleString()} completed · ${p.length} priority</span></div>${rows || '<div class="cat">No matches.</div>'}
    ${w ? '<div class="acts"><button class="btn alt" data-catback>← Back to all</button></div>' : ''}</div>`;
}

function catsTab() {
  const c = catCounts();
  return `<h3 style="font-size:.95rem;margin-top:4px">Categories</h3>

function rogueTab() {
  const list = [...S.rogue].sort((a, b) => (b.active - a.active) || Number(b.weight) - Number(a.weight) || a.name.localeCompare(b.name));
  const tot = S.rogue.reduce((a, x) => a + (x.active ? Number(x.weight) || 0 : 0), 0);
  return `<h3 style="font-size:.95rem;margin-top:4px">Random Roguelike</h3>
    <div class="cat">When Random Roguelike comes up on the wheel, Roll picks chooses one of these by weight. Tick a game to put it on the wheel.</div>
    <div style="margin-top:8px">${list.map(x => `<div class="chkrow"><input type="checkbox" data-ract="${x.id}" ${x.active ? 'checked' : ''}><span>${esc(x.name)}</span><span class="cat" style="width:3.2em;text-align:right">w ${Number(x.weight)}</span><span class="cat" style="width:3.4em;text-align:right">${x.active && tot > 0 ? (Number(x.weight) / tot * 100).toFixed(1) + '%' : '—'}</span><button class="btn alt" style="padding:3px 10px" data-rlk="${x.id}">Edit</button></div>`).join('') || '<div class="cat">No roguelikes yet. Run 7_roguelike.sql, or add one below.</div>'}</div>

function bookTree(sec) {

      const first = kids.find(c => c.getBoundingClientRect().left > mid); if (!first || first.classList.contains('bk-grp')) break;
      const prev = body.querySelector('.cont'); if (prev && prev.nextElementSibling === first) break;
      let h = first.previousElementSibling; while (h && !h.classList.contains('bk-grp')) h = h.previousElementSibling; if (!h) break;
      const name = (h.querySelector('.tt') ? h.querySelector('.tt').textContent : '').replace(/ · \d+$/, '').replace(/ cont\.$/, '');
      const d = document.createElement('div'); d.className = 'bk-r bk-grp cont'; d.innerHTML = '<span class="t"><span class="tt"></span></span>'; d.querySelector('.tt').textContent = name + ' cont.'; body.insertBefore(d, first);

/* movies: consecutive decades are packed into at most 6 columns; small decades share a column, big ones get their own */
function dMovieGroups() {
  const bands = mgBands(dList(DMOV)), noYear = bands.find(b => b.name === 'No year'), decs = bands.filter(b => b !== noYear), n = decs.reduce((a, b) => a + b.items.length, 0);
  if (!decs.length) return noYear ? [{ label: 'No year', bands: [noYear] }] : [];
  const pack = T => { const gs = []; decs.forEach(b => { const g = gs[gs.length - 1]; if (g && g.n + b.items.length <= T) { g.bands.push(b); g.n += b.items.length; } else gs.push({ bands: [b], n: b.items.length }); }); return gs; };
  let T = Math.max(Math.ceil(n / 5), ...decs.map(b => b.items.length)), gs = pack(T);
  while (gs.length > 6) gs = pack(++T);
  if (noYear) gs[gs.length - 1].bands.push(noYear);
  return gs.map(g => ({ label: g.bands.filter(b => b !== noYear).map(b => b.name).filter((x, i, a) => i === 0 || i === a.length - 1).join('–'), bands: g.bands }));
}

const MUL = { 1: 'No listens', 2: 'Have heard', 3: 'Know lyrics' };
async function loadMusic() {
  const a = await db.from('music_albums').select('*').range(0, 999), so = await db.from('music_songs').select('*').order('sort_order').range(0, 4999);
  S.malb = a.data || []; S.msong = so.data || []; S.muErr = a.error ? a.error.message : so.error ? so.error.message : null;
}
const muSecs = x => { x = Math.round(x); const h = Math.floor(x / 3600), m = Math.floor(x % 3600 / 60), s = x % 60; return h ? `${h}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}` : `${m}:${String(s).padStart(2, '0')}`; };
const muParse = t => { t = String(t || '').trim(); if (!t) return { v: null }; const p = t.split(':'); if (p.length > 3 || p.some(x => !/^\d+$/.test(x))) return { err: true }; if (p.length === 1) return { v: +p[0] }; if (p.length === 2) return +p[1] < 60 ? { v: +p[0] * 60 + +p[1] } : { err: true }; return +p[1] < 60 && +p[2] < 60 ? { v: +p[0] * 3600 + +p[1] * 60 + +p[2] } : { err: true }; };
/* album rating = average of counted song ratings x 0.6 + average of Themes/Lyrics/Culture x 0.4; blank until both parts exist */
function muCalc(songs, t, l, c) {
  const rs = songs.filter(x => x.counts !== false && x.rating != null && x.rating !== '').map(x => Number(x.rating)), tl = [t, l, c];
  if (!rs.length || tl.some(v => v == null || v === '' || isNaN(Number(v)))) return null;
  const sa = rs.reduce((a, b) => a + b, 0) / rs.length, ta = tl.reduce((a, b) => a + Number(b), 0) / 3;
  return { sa, ta, r: sa * 0.6 + ta * 0.4 };
}
const muSongs = id => S.msong.filter(x => x.album_id === id).sort((a, b) => a.sort_order - b.sort_order || a.id - b.id);
const muAlbR = a => { const c = muCalc(muSongs(a.id), a.themes, a.lyrics, a.culture); return c ? c.r : null; };
const muAlbSecs = a => muSongs(a.id).reduce((n, x) => n + (x.secs || 0), 0);
const muAvg = list => { const r = list.map(muAlbR).filter(v => v != null); return r.length ? r.reduce((a, b) => a + b, 0) / r.length : null; };
const muRf = r => r == null ? '' : r.toFixed(2) + '<span class="star">★</span>';
const muSrf = r => r == null ? '' : Number(r).toFixed(1) + '<span class="star">★</span>';
const muArtists = g => { const by = {}; S.malb.filter(a => a.genre === g).forEach(a => (by[a.artist] = by[a.artist] || []).push(a)); return Object.entries(by).map(([name, albs]) => ({ name, year: albs.map(a => a.artist_year).filter(Boolean).sort()[0] ?? 9999, albs: albs.sort((a, b) => (a.year ?? 9999) - (b.year ?? 9999) || a.id - b.id) })).sort((a, b) => a.year - b.year || a.name.localeCompare(b.name)); };

    const body = arts.map(ar => {
      const albs = ar.albs.filter(a => !q || norm(ar.name).includes(q) || norm(a.title).includes(q) || muSongs(a.id).some(x => norm(x.title).includes(q)));

}

function muPreview() {

/* one song per line: "Title - 4:21", "4:21 Title", "3. Title 4:21"; lines like "1.9M plays" are skipped */
function muParseList(text) {
  const out = [];
  String(text || '').split(/\r?\n/).map(l => l.trim()).filter(l => l && !/plays?\s*$/i.test(l) && !/^[\d.,]+[KMB]?\s*(plays?|views?)?$/i.test(l)).forEach(l => {
    if (/^\d{1,2}:\d{2}(:\d{2})?$/.test(l) && out.length && !out[out.length - 1].time) { out[out.length - 1].time = l; return; }   /* a time on its own line belongs to the song above */
    const r = muParseLine(l); if (r) out.push(r);
  });
  return out;
}
function muParseLine(l) {
  return [l].map(l => {
    const tm = [...l.matchAll(/(?<![\d:])(\d{1,2}:\d{2}(?::\d{2})?)(?![\d:])/g)], last = tm[tm.length - 1];
    let title = last ? (l.slice(0, last.index) + ' ' + l.slice(last.index + last[0].length)) : l;
    title = title.replace(/^\s*\d{1,3}\s*[.)\-–—:]?\s+/, '').replace(/[\s|,\-–—:\t]+$/, '').replace(/^[\s|,\-–—:\t]+/, '').replace(/\s{2,}/g, ' ').trim();
    return title ? { id: null, title, time: last ? last[1] : '', rating: '', listen: 1, counts: true } : null;
  })[0];
}
async function saveMusic() {
  const m = readUm(), title = m.title.trim(), art = (m.artist === '__new__' || !S.malb.some(a => a.genre === m.genre && a.artist === m.artist) ? (m.artist === '__new__' ? m.artistNew : m.artist) : m.artist) || '';
  if (!title) return toast('Add an album title first'); if (!String(art).trim()) return toast('Add the artist name');
  const num = v => String(v).trim() === '' ? null : Number(v);
  for (const k of ['t', 'l', 'c']) { const v = num(m[k]); if (v != null && !(v >= 0 && v <= 5)) return toast('Themes / Lyrics / Culture must be 0–5'); }
  const songs = []; for (const [i, x] of m.songs.entries()) { if (!String(x.title).trim()) continue; const t = muParse(x.time); if (t.err) return toast(`Song "${x.title}": time should look like 4:21`); const r = num(x.rating); if (r != null && !(r >= 0 && r <= 5)) return toast(`Song "${x.title}": rating must be 0–5`); songs.push({ id: x.id, title: String(x.title).trim(), secs: t.v, rating: r, listen: x.listen, counts: !!x.counts }); }
  const payload = { genre: m.genre, artist: String(art).trim(), artist_year: num(m.artistYear), title, year: num(m.year), themes: num(m.t), lyrics: num(m.l), culture: num(m.c) };
  const res = m.id ? await db.from('music_albums').update(payload).eq('id', m.id).select().single() : await db.from('music_albums').insert(payload).select().single();
  if (res.error) return toast('Save failed: ' + res.error.message);
  const aid = res.data.id;
  if (payload.artist_year != null) await db.from('music_albums').update({ artist_year: payload.artist_year }).eq('genre', payload.genre).eq('artist', payload.artist);
  const keep = songs.filter(x => x.id).map(x => x.id), gone = muSongs(aid).map(x => x.id).filter(id => !keep.includes(id));
  if (gone.length) { const d = await db.from('music_songs').delete().in('id', gone); if (d.error) return toast('Save failed: ' + d.error.message); }
  for (const [i, x] of songs.entries()) {
    const row = { sort_order: i, title: x.title, secs: x.secs, rating: x.rating, listen: x.listen, counts: x.counts };
    const w = x.id ? await db.from('music_songs').update(row).eq('id', x.id) : await db.from('music_songs').insert({ ...row, album_id: aid });
    if (w.error) return toast('Save failed: ' + w.error.message);
  }
  S.mum = null; await loadMusic(); render();
}

  const tabs = [['overview', 'Overview'], ...CATS, ['years', 'Years']].map(([k, l]) => `<button class="${S.cat === k ? 'on' : ''}" data-ctab="${k}">${l}</button>`).join('');
  const body = S.cat === 'overview' ? overview() : S.cat === 'years' ? yearsView() : catView(S.cat);

function cuBlock(arrows) {
  const c = rankedCU();
  return `<div class="head" style="margin:14px 0 4px"><h3 style="font-size:.9rem">Catch up</h3><button class="btn alt" data-cadd="manga" data-cst="catchup">Add</button></div>

function overview() {
  return `<div class="ovg">${CATS.map(([k, l]) => { const r = ranked(k);
    return `<div class="card"><div class="head"><h2 style="cursor:pointer" data-ctab="${k}">${l}</h2><button class="btn alt" data-cadd="${k}">Add</button></div>
      ${r.map((i, n) => rankRow(i, n + 1, false)).join('') || '<div class="cat">Nothing current.</div>'}${k === 'manga' ? cuBlock(false) : ''}</div>`; }).join('')}</div>`;
}

function catView(k) {
  const all = cur(k).sort((a, b) => a.sort_order - b.sort_order), r = ranked(k);
  const F = { all: ['All', i => i.status !== 'dropped' && i.status !== 'rewatch' && i.status !== 'catchup'], prog: ['In progress', i => !i.done && i.status === 'active'], paused: ['Paused', i => i.status === 'paused'], done: ['Done', i => i.done], dropped: ['Dropped', i => i.status === 'dropped'], rewatch: ['Rewatch', i => i.status === 'rewatch'], catchup: ['Catch up', i => i.status === 'catchup'] };
  const chips = Object.entries(F).map(([f, [l, fn]]) => [f, l, all.filter(fn).length]).filter(([f, , n]) => f === 'all' || n || f === S.flt)
    .map(([f, l, n]) => `<button class="${S.flt === f ? 'on' : ''}" data-cflt="${f}">${l} (${n})</button>`).join('');
  const rows = all.filter((F[S.flt] || F.all)[1]);
  return `<div class="cols"><div class="card"><div class="head"><h2>Current</h2><button class="btn" data-cadd="${k}">Add</button></div>
    ${r.map((i, n) => rankRow(i, n + 1, true)).join('') || '<div class="cat">Nothing current.</div>'}${k === 'manga' ? cuBlock(true) : ''}</div>
    <div class="card"><div class="head"><h2>All ${catName(k).toLowerCase()}</h2></div><div class="seg sm">${chips}</div>
    <div class="row th"><div class="c0">#</div><div class="t1">Title</div><div class="t2">How far</div><div class="t3">Total</div><div class="t4"></div></div>
    ${rows.map((i, n) => curRow(i, n + 1)).join('') || '<div class="cat">Nothing here.</div>'}</div></div>`;
}

function yearsView() {
  const done = S.current.filter(i => i.done), ys = [...new Set(done.map(i => i.done_year).filter(Boolean))].sort();
  const sel = S.yr ?? (ys.length ? ys[ys.length - 1] : 'all');
  const chip = (v, l) => `<button class="${String(sel) === String(v) ? 'on' : ''}" data-cyr="${v}">${l}</button>`;
  const cnt = (k, y) => done.filter(i => i.category === k && (y === 'all' || i.done_year === y)).length;
  const matrix = `<table class="mx"><tr><th></th>${ys.map(y => `<th style="color:${yc(y)}">${y}</th>`).join('')}<th>Total</th></tr>
    ${CATS.map(([k, l]) => `<tr><td>${l}</td>${ys.map(y => `<td>${cnt(k, y) || '·'}</td>`).join('')}<td>${cnt(k, 'all') || '·'}</td></tr>`).join('')}
    <tr><th>All</th>${ys.map(y => `<th>${done.filter(i => i.done_year === y).length}</th>`).join('')}<th>${done.length}</th></tr></table>`;
  const list = done.filter(i => sel === 'all' || i.done_year === sel);
  const groups = CATS.map(([k, l]) => [l, list.filter(i => i.category === k)]).filter(([, a]) => a.length);

}

function readCm() {
  const m = S.cm; m.title = $('#c-title').value; m.progress = $('#c-prog').value; m.total = $('#c-tot').value; m.status = $('#c-status').value;
  m.incur = $('#c-incur').checked; m.done = $('#c-done').checked; m.year = $('#c-year') ? Number($('#c-year').value) : (m.done ? (m.year || new Date().getFullYear()) : m.year);
  return m;
}

async function saveCur() {
  const m = readCm(), title = m.title.trim();
  if (!title) return toast('Add a title first');
  const old = m.id ? S.current.find(x => x.id === m.id) : null;
  let rank = null;
  if (m.incur && !m.done) {
    const cu = m.status === 'catchup', same = old && old.rank != null && (old.status === 'catchup') === cu;
    rank = same ? old.rank : Math.max(0, ...(cu ? rankedCU() : ranked(m.category)).filter(i => i.id !== m.id).map(i => i.rank)) + 1;
  }
  const payload = { category: m.category, title, progress: m.progress.trim() || null, total: m.total.trim() || null, status: m.status, done: m.done, done_year: m.done ? m.year : null, rank };
  let res;
  if (m.id) res = await db.from('current_items').update(payload).eq('id', m.id).select().single();
  else { payload.sort_order = Math.max(0, ...S.current.map(i => i.sort_order)) + 1; res = await db.from('current_items').insert(payload).select().single(); }
  if (res.error) return toast('Save failed: ' + res.error.message);
  S.current = S.current.filter(i => i.id !== res.data.id).concat(res.data);
  S.cm = null; render();
}

async function delCur() {
  if (!confirm('Delete this item?')) return;
  const { error } = await db.from('current_items').delete().eq('id', S.cm.id);
  if (error) return toast('Delete failed: ' + error.message);
  S.current = S.current.filter(i => i.id !== S.cm.id); S.cm = null; render();
}

async function moveRank(id, dir) {
  const it = S.current.find(x => x.id == id), r = it.status === 'catchup' ? rankedCU() : ranked(it.category), o = r[r.findIndex(x => x.id == id) + dir];
  if (!o) return;
  const [a, b] = [it.rank, o.rank];
  const e1 = await db.from('current_items').update({ rank: b }).eq('id', it.id), e2 = await db.from('current_items').update({ rank: a }).eq('id', o.id);
  if (e1.error || e2.error) return toast('Could not reorder');
  it.rank = b; o.rank = a; render();
}

/* ---------- Wheel roll ---------- */
const mapped = name => { const o = S.options.find(x => x.name === name); return o && o.current_cat ? o : null; };
function wheelHtml() {
  const w = S.wheel, pool = S.options.filter(o => o.active && Number(o.weight) > 0).sort((a, b) => Number(b.weight) - Number(a.weight) || a.sort_order - b.sort_order);
  const tot = pool.reduce((a, o) => a + Number(o.weight), 0), taken = new Set(w.res.map(r => r.fid).filter(Boolean));
  const rows = w.res.map((r, i) => {
    const futs = by('future').filter(f => f.category === r.cat && f.description && (!taken.has(f.id) || f.id === r.fid)), m = mapped(r.cat);
    return `<div class="rr"><div class="rh"><span class="n">${i + 1}</span><b>${esc(r.cat)}</b><button class="x" data-wdel="${i}" title="Remove">×</button></div>
      <input data-ri="${i}" value="${esc(r.desc)}" placeholder="${m ? 'What (Roll picks fills this)' : 'What (optional)'}">
      ${futs.length ? `<select data-rf="${i}"><option value="">Choose from Future (${futs.length})…</option>${futs.map(f => `<option value="${f.id}" ${f.id === r.fid ? 'selected' : ''}>${esc(f.description)}</option>`).join('')}</select>` : ''}</div>`;
  }).join('');
  const anyMapped = w.res.some(r => mapped(r.cat));
  return `<div class="modal"><div class="sheet"><div class="head"><h2>Roll the wheel</h2><button class="btn alt" data-cancel>Close</button></div>
    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><span class="cat">Rolls</span><input id="w-n" type="number" min="1" max="100" value="${w.n}" style="width:5em"><button class="btn" data-wroll>${w.res.length ? 'Roll again' : 'Roll'}</button>${anyMapped ? '<button class="btn alt" data-wcur>Roll picks</button>' : ''}</div>
    ${w.res.length ? `<h3 style="font-size:.95rem;margin-top:14px">Rolled (${w.res.length})</h3>${rows}<div class="acts"><button class="btn" data-wadd>Add ${w.res.length} to Priority</button></div>` : ''}
    <h3 style="font-size:.95rem;margin-top:18px">Categories on the wheel</h3><div class="cat">Change these in Settings (⚙︎).</div>
    <div style="margin-top:6px">${pool.map(o => `<div class="wro"><span>${esc(o.name)}${o.current_cat ? ` <span class="cat">→ ${linkName(o.current_cat)}</span>` : ''}</span><span class="cat">w ${Number(o.weight)}</span><span class="cat" style="width:3.6em;text-align:right">${(Number(o.weight) / tot * 100).toFixed(1)}%</span></div>`).join('') || '<div class="cat">Nothing is on the wheel. Turn categories on in Settings.</div>'}</div></div></div>`;
}
function doRoll() {
  const n = Math.max(1, Math.min(100, parseInt($('#w-n').value) || 1)); S.wheel.n = n;
  const pool = S.options.filter(o => o.active && Number(o.weight) > 0), tot = pool.reduce((a, o) => a + Number(o.weight), 0);
  if (!pool.length) return toast('Turn on at least one category with a weight above 0 in Settings');
  S.wheel.res = Array.from({ length: n }, () => { let r = Math.random() * tot, c = pool[pool.length - 1].name; for (const o of pool) { r -= Number(o.weight); if (r < 0) { c = o.name; break; } } return { cat: c, desc: '', src: '', fid: null }; });
  render();
}
function pickFrom(key) {
  if (key === 'roguelike') {
    const pool = S.rogue.filter(x => x.active && Number(x.weight) > 0); if (!pool.length) return null;
    let r = Math.random() * pool.reduce((a, x) => a + Number(x.weight), 0);
    for (const x of pool) { r -= Number(x.weight); if (r < 0) return x.name; }
    return pool[pool.length - 1].name;
  }
  const list = key === 'catchup' ? rankedCU() : ranked(key); if (!list.length) return null;
  const w = list.map((_, i) => 1 / (i + 1)); let x = Math.random() * w.reduce((a, b) => a + b, 0);
  for (let i = 0; i < list.length; i++) { x -= w[i]; if (x < 0) return list[i].title; }
  return list[list.length - 1].title;
}
function rollCurrent() {
  let done = 0; const empty = new Set();
  S.wheel.res.forEach(r => {
    const o = mapped(r.cat); if (!o || r.src === 'future' || r.src === 'typed') return;
    const t = pickFrom(o.current_cat); if (t == null) { empty.add(linkName(o.current_cat)); return; }
    r.desc = t; r.src = 'roll'; r.fid = null; done++;
  });
  if (empty.size) toast('Nothing to pick from in ' + [...empty].join(', '));
  else if (!done) toast('Nothing to fill in');
  render();
}
async function addRolls() {
  let so = Math.max(0, ...S.entries.map(e => e.sort_order));
  const rows = S.wheel.res.map(r => ({ category: r.cat, description: r.desc.trim() || null, status: 'priority', done_on: null, sort_order: ++so }));
  const { data, error } = await db.from('log_entries').insert(rows).select();
  if (error) return toast('Save failed: ' + error.message);
  const ids = new Set(S.wheel.res.map(r => r.fid).filter(Boolean));
  by('future').forEach(f => { if (rows.some(r => r.description && r.category === f.category && norm(r.description) === norm(f.description))) ids.add(f.id); });
  if (ids.size) { const d = await db.from('log_entries').delete().in('id', [...ids]); if (d.error) toast('Added, but could not clear Future: ' + d.error.message); else S.entries = S.entries.filter(e => !ids.has(e.id)); }
  S.entries = S.entries.concat(data).sort((a, b) => a.sort_order - b.sort_order);
  S.wheel = null; S.sub = 'now'; S.anchor = true; render(); toast(`Added ${data.length} to Priority`);
}

/* ---------- actions ---------- */
function openModal(e, opts = {}) { S.modal = { pick: null, id: e.id || null, category: e.category || '', description: e.description || '', status: e.status, done_on: e.done_on || '', finish: !!opts.finish }; render(); }

async function save(status) {
  const m = S.modal;
  const category = $('#m-cat').value || null, description = $('#m-desc').value.trim() || null;
  const done_on = status === 'done' ? ($('#m-date')?.value || today()) : null;
  if (status === 'done' && !category && !description) return toast('Add a category or what you did first');
  const pick = m.pick;
  const payload = { category, description, status, done_on };
  let res;
  if (m.id) res = await db.from('log_entries').update(payload).eq('id', m.id).select().single();
  else { payload.sort_order = Math.max(0, ...S.entries.map(e => e.sort_order)) + 1; res = await db.from('log_entries').insert(payload).select().single(); }
  if (res.error) return toast('Save failed: ' + res.error.message);
  S.entries = S.entries.filter(e => e.id !== res.data.id).concat(res.data);
  if (status === 'priority') {
    const dupes = by('future').filter(f => f.id === Number(pick) || (description && f.category === category && norm(f.description) === norm(description)));
    for (const f of dupes) { await db.from('log_entries').delete().eq('id', f.id); S.entries = S.entries.filter(e => e.id !== f.id); }
  }
  S.entries.sort((a, b) => a.sort_order - b.sort_order);
  S.anchor = !(m.id && m.status === 'done' && status === 'done');
  S.modal = null; render();
}

function fillLines() {
  const pre = $('#b-pre').value.trim(), from = parseInt($('#b-from').value), to = parseInt($('#b-to').value), per = parseInt($('#b-per').value) || 1;
  if (!(from > 0 && to >= from)) return toast('Enter a From and To number');
  const out = [];
  for (let n = from; n <= to; n += per) { const e = Math.min(n + per - 1, to); out.push(`${pre} ${e > n ? n + '-' + e : n}`.trim()); }
  $('#b-lines').value = out.join('\n');
}

async function saveBulk() {
  const b = S.bulk, category = $('#b-cat').value || null;
  const lines = $('#b-lines').value.split('\n').map(x => x.trim()).filter(Boolean);
  const descs = lines.length ? lines : Array(parseInt($('#b-empty').value) || 0).fill(null);
  if (!descs.length) return toast('Add some lines or a number of empty rows');
  if (descs.length > 200) return toast('Add 200 or fewer at a time');
  let so = Math.max(0, ...S.entries.map(e => e.sort_order));
  const rows = descs.map(d => ({ category, description: d, status: b.status, done_on: null, sort_order: ++so }));
  const { data, error } = await db.from('log_entries').insert(rows).select();
  if (error) return toast('Save failed: ' + error.message);
  S.entries = S.entries.concat(data);
  if (b.status === 'priority') {
    const names = new Set(lines.map(norm));
    for (const f of by('future').filter(f => f.category === category && names.has(norm(f.description)))) { await db.from('log_entries').delete().eq('id', f.id); S.entries = S.entries.filter(e => e.id !== f.id); }
  }
  S.entries.sort((a, b) => a.sort_order - b.sort_order);
  S.bulk = null; S.anchor = true; render(); toast(`Added ${data.length} rows`);
}

async function toggleVis(box) {
  const name = box.dataset.vis, show = box.checked, o = S.options.find(x => x.name === name);
  const res = o ? await db.from('wheel_options').update({ show_in_menu: show }).eq('id', o.id).select().single()
    : await db.from('wheel_options').insert({ name, weight: 1, active: false, sort_order: Math.max(0, ...S.options.map(x => x.sort_order)) + 1, show_in_menu: show }).select().single();
  if (res.error) { box.checked = !show; return toast('Could not save: ' + res.error.message); }
  if (o) Object.assign(o, res.data); else S.options.push(res.data);
}

async function addCat() {
  const name = $('#s-new').value.replace(/\s+/g, ' ').trim();
  if (!name) return;
  if (allCats().some(c => c.toLowerCase() === name.toLowerCase())) return toast('That category already exists');
  const { data, error } = await db.from('wheel_options').insert({ name, weight: 1, active: false, sort_order: Math.max(0, ...S.options.map(x => x.sort_order)) + 1, show_in_menu: true }).select().single();
  if (error) return toast('Could not add: ' + error.message);
  S.options.push(data); render(); toast('Added ' + name);
}

async function del() {
  if (!confirm('Delete this item?')) return;
  const { error } = await db.from('log_entries').delete().eq('id', S.modal.id);
  if (error) return toast('Delete failed: ' + error.message);
  S.entries = S.entries.filter(e => e.id !== S.modal.id); S.modal = null; render();
}

  if (S.modal && (e.target.id === 'm-cat' || e.target.id === 'm-status')) { const m = S.modal; if (e.target.id === 'm-cat' && m.pick) { const pf = S.entries.find(x => x.id == m.pick); if (pf && $('#m-desc').value === (pf.description || '')) $('#m-desc').value = ''; m.pick = null; } m.category = $('#m-cat').value; m.description = $('#m-desc').value; m.done_on = $('#m-date')?.value || m.done_on; if (e.target.id === 'm-status') m.status = e.target.value; render(); }

document.addEventListener('input', e => {
  if (e.target.id === 'b-grp' || e.target.id === 'b-sub' || e.target.id === 'b-year') return refreshPos();
  if (e.target.classList.contains('sc') || e.target.classList.contains('scx')) { const P = S.mdm ? 'd' : S.gm ? 'g' : 'm', sc = readScores(), t = mScoreSum(sc), r = $('#' + P + '-rate'), info = mScoreInfo(sc); r.readOnly = t != null; if (t != null) r.value = t.toFixed(1);
    sc.forEach((x, i) => $('#' + P + '-sc' + i).classList.toggle('over', x[1] !== '' && Number(x[1]) > Number(x[2])));
    const ok = $('#' + P + '-scok'); ok.className = 'scok ' + (info.ok ? 'good' : 'warn'); ok.textContent = (info.ok ? '✓ Criteria add up to 100 · ' : '⚠ Criteria add up to ' + info.mx + ', not 100 · ') + info.line; return; }
  if (e.target.id === 'mq') { S.mq = e.target.value; const pos = e.target.selectionStart, sc = document.querySelector('.bk-scroll'), y = sc ? sc.scrollTop : 0; render(); const q = $('#mq'); q.focus(); q.setSelectionRange(pos, pos); const n = document.querySelector('.bk-scroll'); if (n) n.scrollTop = y; return; }
  if (S.mum && (e.target.classList.contains('uin') || e.target.classList.contains('us-c'))) return muPreview();
  if (e.target.id === 'muq') { S.muq = e.target.value; const pos = e.target.selectionStart, sc = document.querySelector('.bk-scroll'), y = sc ? sc.scrollTop : 0; render(); const q = $('#muq'); q.focus(); q.setSelectionRange(pos, pos); const n = document.querySelector('.bk-scroll'); if (n) n.scrollTop = y; return; }
  if (e.target.id === 'mdq') { S.mdq = e.target.value; const pos = e.target.selectionStart, sc = document.querySelector('.bk-scroll'), y = sc ? sc.scrollTop : 0; render(); const q = $('#mdq'); q.focus(); q.setSelectionRange(pos, pos); const n = document.querySelector('.bk-scroll'); if (n) n.scrollTop = y; return; }
  if (e.target.id === 'gq') { S.gq = e.target.value; const pos = e.target.selectionStart, sc = document.querySelector('.bk-scroll'), y = sc ? sc.scrollTop : 0; render(); const q = $('#gq'); q.focus(); q.setSelectionRange(pos, pos); const n = document.querySelector('.bk-scroll'); if (n) n.scrollTop = y; return; }
  if (e.target.id === 'bq') { S.bq = e.target.value; const pos = e.target.selectionStart, sc = document.querySelector('.bk-scroll'), y = sc ? sc.scrollTop : 0; render(); const q = $('#bq'); q.focus(); q.setSelectionRange(pos, pos); const n = document.querySelector('.bk-scroll'); if (n) n.scrollTop = y; return; }
  if (e.target.dataset.ri !== undefined) { const r = S.wheel.res[Number(e.target.dataset.ri)], v = e.target.value; r.desc = v; r.src = v.trim() ? 'typed' : '';
    if (r.fid) { const f = S.entries.find(x => x.id === r.fid); if (!f || f.description !== v) r.fid = null; } return; } if (e.target.id === 'q') { S.q = e.target.value; const pos = e.target.selectionStart; render(); const q = $('#q'); q.focus(); q.setSelectionRange(pos, pos); } });
document.addEventListener('submit', async e => {
  if (e.target.id !== 'login') return;
  e.preventDefault();
  const { error } = await db.auth.signInWithPassword({ email: $('#em').value, password: $('#pw').value });
  if (error) $('#lerr').textContent = 'Sign-in failed: ' + error.message;
});

db.auth.onAuthStateChange((_ev, session) => {
  const was = S.user; S.user = session?.user || null;
  if (S.user && !was) loadAll(); else if (!S.user) { S.entries = []; render(); }
});
db.auth.getSession().then(({ data }) => { if (!data.session) render(); });
</script>
